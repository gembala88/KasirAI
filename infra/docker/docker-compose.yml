# ERPNext stack, tuned for the confirmed 2 vCPU / 2 GB RAM VPS (spec §13).
#
# Based on the official frappe_docker `pwd.yml` reference (single-site,
# single-compose getting-started layout — no custom Frappe app needed for
# MVP, per spec §3.2), with these deviations applied for the low-RAM target:
#   - GUNICORN_WORKERS=1 (spec §13: "limit gunicorn workers to 1")
#   - queue-long and queue-short merged into one `queue` worker (spec §13:
#     "disable unused modules to reduce background job load" — with only
#     Selling/Buying/Stock/Accounting active, one worker covers the volume)
#   - `mem_limit` set on every long-running container (spec §13: "explicit
#     Docker memory limits per container so one container can't starve the
#     others") — see the running budget table below, kept up to date as
#     services are added so the 2 GB ceiling stays visible at a glance.
#   - MariaDB given a low-memory my.cnf (infra/erpnext/mariadb/hermes-tuning.cnf)
#
# Only the `erpnext` app is installed (not the separate `hrms` app), which
# is how HR stays out of this instance per spec §13. Manufacturing/Projects
# ship inside the `erpnext` app itself — see README.md "First login" for how
# to hide them from the UI via the Setup Wizard's domain selection.
#
# `hermes-redis` (below) is a separate Redis instance for the Node API's
# own use (BullMQ job queues, later caching) — distinct from redis-cache/
# redis-queue above, which belong to ERPNext's Frappe workers only (per the
# architecture diagram in spec §2).
#
# Phase 9: `api`, `dashboard`, and `pwa-scanner` are now real services in
# this file — apps/api ran on the host through Phase 8 (see the git
# history of this comment block), containerized here since a production
# VPS deploy needs it managed the same way as everything else (restart
# policy, mem_limit, no bare `node` process babysat by hand).
#
# --- Memory budget (spec §13's 2 GB ceiling, dedicated VPS) -------------
#   Service          mem_limit   idle usage (docker stats, Phase 3)
#   backend          380m        ~232 MiB
#   db               480m        ~268 MiB
#   queue            280m        ~54 MiB
#   scheduler        140m        ~51 MiB
#   frontend         110m        ~8 MiB
#   websocket        90m         ~26 MiB
#   redis-queue      60m         ~11 MiB
#   hermes-redis     60m         ~8 MiB   (added Phase 3, for BullMQ)
#   redis-cache      30m         ~14 MiB
#   api              180m        (added Phase 9)
#   dashboard        40m         (added Phase 9 — static nginx, trivial footprint)
#   pwa-scanner      40m         (added Phase 9 — static nginx, trivial footprint)
#   ------------------------------------------------------------------
#   Total mem_limit: 1890m (~1.85 GB) of the 2 GB VPS, leaving ~150 MB
#   for the host OS + the reverse-proxy Nginx (runs on the host, not in
#   this compose file — see infra/nginx) + the 2 GB swap buffer configured
#   by infra/erpnext/scripts/setup-vps-swap.sh. Re-check this table
#   whenever a service is added or a limit changes — it's meant to be the
#   one place that answers "how much headroom is left" without adding up
#   the file.
#
#   These are the numbers for a *dedicated* 2 vCPU/2 GB VPS, matching
#   spec §13's own assumption. For the specific shared VPS this project
#   was smoke-tested against (already running unrelated projects,
#   ~860 MB committed before Hermes even starts), see
#   docker-compose.shared-vps-test.yml — a Compose override with a
#   further-trimmed budget and an explicit note on the performance
#   trade-off, not a replacement for these numbers.
#
# --- CPU budget (spec §13's 2 vCPU ceiling, added Phase 8 for load
#     testing) --------------------------------------------------------
#   Service          cpus
#   backend          0.55  (gunicorn, single worker — the main request path)
#   db               0.55  (MariaDB — the other heavy hitter under write load)
#   queue            0.15
#   scheduler        0.05
#   frontend         0.05
#   websocket        0.05
#   redis-queue      0.03
#   redis-cache      0.03
#   hermes-redis     0.03
#   api              0.35
#   dashboard        0.05
#   pwa-scanner      0.05
#   ------------------------------------------------------------------
#   Total cpus: 1.94 — a dev machine with more cores than the VPS would
#   otherwise mask real contention; this makes `docker compose up` behave
#   like the real 2 vCPU box regardless of host hardware.
#
# Usage: see README.md "Running ERPNext locally / on the VPS".
#
# Data retention (post-launch requirement): Docker's json-file driver has no
# calendar-day rotation, and deleting an active container's log file out
# from under it doesn't actually free space until the container restarts —
# so "30-day raw logs" is enforced here as a size/count bound instead, which
# is the safe way to cap the same class of data. 10m x 5 files per service
# comfortably covers 30+ days of normal volume for a single-store deployment
# and is rotated by Docker itself, not a cron job touching log files
# directly. Applied to every long-running service; the one-shot
# configurator/create-site containers exit almost immediately and don't
# need it. See RUNBOOK.md's "Data retention" section for the full policy
# (including nginx's own logrotate config and the app-level
# offline_sync_queue cleanup job, apps/api/src/modules/sync/infrastructure/retention-queue.ts).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  backend:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.30.0}
    logging: *default-logging
    networks:
      - hermes_network
    mem_limit: 380m
    cpus: 0.55
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      GUNICORN_WORKERS: '1'
      GUNICORN_THREADS: '4'
      GUNICORN_TIMEOUT: '120'
    depends_on:
      configurator:
        condition: service_completed_successfully

  configurator:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.30.0}
    networks:
      - hermes_network
    deploy:
      restart_policy:
        condition: none
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: '9000'
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  create-site:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.30.0}
    networks:
      - hermes_network
    deploy:
      restart_policy:
        condition: none
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        if [ -d "sites/$$SITE_NAME" ]; then
          echo "Site $$SITE_NAME already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%' --admin-password=$$ADMIN_PASSWORD --db-root-username=root --db-root-password=$$DB_ROOT_PASSWORD --install-app erpnext --set-default $$SITE_NAME;
        fi;
    environment:
      SITE_NAME: ${SITE_NAME:-hermes.localhost}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}

  db:
    image: mariadb:11.8
    logging: *default-logging
    networks:
      - hermes_network
    mem_limit: 480m
    cpus: 0.55
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
      - ../erpnext/mariadb/hermes-tuning.cnf:/etc/mysql/conf.d/hermes-tuning.cnf:ro

  frontend:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.30.0}
    logging: *default-logging
    networks:
      - hermes_network
    mem_limit: 110m
    cpus: 0.05
    depends_on:
      - websocket
      - backend
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-hermes.localhost}
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: 'off'
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    # 127.0.0.1-only, not 0.0.0.0 — same reasoning as api/dashboard/
    # pwa-scanner below: Nginx (infra/nginx) is the only thing that should
    # be internet-facing on this box. Was 0.0.0.0 through Phase 9 (a
    # leftover local-dev default — harmless only as long as a firewall
    # outside Docker's control was also blocking the port); fixed as
    # defense-in-depth once the domain/HTTPS work made port 80/443
    # reachability an active concern, rather than relying solely on the
    # cloud firewall to keep ERPNext's admin panel off the open internet.
    ports:
      - '127.0.0.1:${HTTP_PUBLISH_PORT:-8080}:8080'

  queue:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.30.0}
    logging: *default-logging
    networks:
      - hermes_network
    mem_limit: 280m
    cpus: 0.15
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - worker
      - --queue
      - short,default,long
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully

  redis-queue:
    image: redis:6.2-alpine
    logging: *default-logging
    networks:
      - hermes_network
    mem_limit: 60m
    cpus: 0.03
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:6.2-alpine
    logging: *default-logging
    networks:
      - hermes_network
    mem_limit: 30m
    cpus: 0.03
    deploy:
      restart_policy:
        condition: on-failure

  hermes-redis:
    image: redis:6.2-alpine
    logging: *default-logging
    networks:
      - hermes_network
    mem_limit: 60m
    cpus: 0.03
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - hermes-redis-data:/data
    # 127.0.0.1-only — same defense-in-depth reasoning as `frontend` above.
    # The containerized `api` service never uses this published port at all
    # (it reaches hermes-redis over the internal Docker network via
    # redis://hermes-redis:6379); this port only exists for local dev,
    # where apps/api runs on the bare host and needs to reach into the
    # Docker network — 127.0.0.1 binding still works fine for that.
    ports:
      - '127.0.0.1:${HERMES_REDIS_PUBLISH_PORT:-6380}:6379'

  scheduler:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.30.0}
    logging: *default-logging
    networks:
      - hermes_network
    mem_limit: 140m
    cpus: 0.05
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  websocket:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.30.0}
    logging: *default-logging
    networks:
      - hermes_network
    mem_limit: 90m
    cpus: 0.05
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  # --- Hermes application layer (Phase 9) ---------------------------------
  # apps/api ran on the host through Phase 8; containerized here so a real
  # deploy manages it the same way as everything else. Talks to ERPNext and
  # Redis by their in-network service names (`frontend`, `hermes-redis`),
  # not localhost/host.docker.internal — see .env.vps.example for the
  # container-network-aware values this needs that differ from local dev.
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    logging: *default-logging
    networks:
      - hermes_network
    mem_limit: 180m
    cpus: 0.35
    deploy:
      restart_policy:
        condition: on-failure
    env_file:
      - ../../.env
    environment:
      PORT: '3001'
      ERPNEXT_BASE_URL: http://frontend:8080
      REDIS_URL: redis://hermes-redis:6379
      ERPNEXT_WEBHOOK_CALLBACK_URL: http://api:3001/webhooks/erpnext
    volumes:
      - api-data:/repo/apps/api/data
    depends_on:
      - frontend
      - hermes-redis
    # 127.0.0.1-only, not 0.0.0.0 — reachable from the host's own Nginx
    # (infra/nginx), never directly from the public internet. Nginx is
    # the only thing that should be internet-facing on this box.
    ports:
      - '127.0.0.1:${API_PUBLISH_PORT:-3001}:3001'

  # Static builds only (no Node runtime) — Nginx serving pre-built files,
  # trivial memory footprint. VITE_API_BASE_URL is baked in at image build
  # time (see infra/docker/Dockerfile.dashboard), not runtime-configurable.
  dashboard:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dashboard
      args:
        VITE_API_BASE_URL: ${DASHBOARD_API_BASE_URL:-/api}
    logging: *default-logging
    networks:
      - hermes_network
    mem_limit: 40m
    cpus: 0.05
    deploy:
      restart_policy:
        condition: on-failure
    depends_on:
      - api
    ports:
      - '127.0.0.1:${DASHBOARD_PUBLISH_PORT:-5175}:80'

  pwa-scanner:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.pwa-scanner
      args:
        VITE_API_BASE_URL: ${PWA_SCANNER_API_BASE_URL:-/api}
    logging: *default-logging
    networks:
      - hermes_network
    mem_limit: 40m
    cpus: 0.05
    deploy:
      restart_policy:
        condition: on-failure
    depends_on:
      - api
    ports:
      - '127.0.0.1:${PWA_SCANNER_PUBLISH_PORT:-5176}:80'

volumes:
  db-data:
  redis-queue-data:
  hermes-redis-data:
  sites:
  logs:
  # Hermes' own SQLite (ai_action_audit, offline_sync_queue, etc., spec
  # §5) — a named volume, not bind-mounted, so it survives a container
  # rebuild/restart the same way the ERPNext volumes above do.
  api-data:

networks:
  hermes_network:
    driver: bridge
